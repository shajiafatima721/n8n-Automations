<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lead Form — n8n automation demo</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background:#f5f6f8; }
    .card { border:none; border-radius:16px; box-shadow:0 4px 20px rgba(0,0,0,.07); }
  </style>
</head>
<body>
  <div class="container py-5" style="max-width:540px;">
    <h3 class="mb-1">Get in touch</h3>
    <p class="text-muted mb-4">This form posts to an n8n webhook that saves the lead to
       Google Sheets, emails a confirmation, and notifies a Telegram chat.</p>

    <div class="card p-4">
      <!-- Replace WEBHOOK_URL with your n8n webhook URL, e.g. https://your-n8n/webhook/lead -->
      <form id="lead-form" action="WEBHOOK_URL" method="post">
        <div class="mb-3">
          <label class="form-label">Name</label>
          <input name="name" class="form-control" required>
        </div>
        <div class="mb-3">
          <label class="form-label">Email</label>
          <input name="email" type="email" class="form-control" required>
        </div>
        <div class="mb-3">
          <label class="form-label">Message</label>
          <textarea name="message" class="form-control" required></textarea>
        </div>
        <button class="btn btn-primary w-100" type="submit">Send</button>
        <div id="result" class="mt-3 small"></div>
      </form>
    </div>
  </div>

  <script>
    // Submit via fetch so the browser doesn't redirect, and show a friendly result.
    document.getElementById('lead-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const form = e.target;
      const result = document.getElementById('result');
      const action = form.getAttribute('action');
      result.textContent = 'Sending…';
      result.className = 'mt-3 small text-muted';
      try {
        const res = await fetch(action, {
          method: 'POST',
          body: new FormData(form),
        });
        if (res.ok) {
          result.textContent = '✅ Thanks! Your message was sent.';
          result.className = 'mt-3 small text-success';
          form.reset();
        } else {
          throw new Error('HTTP ' + res.status);
        }
      } catch (err) {
        result.textContent = '⚠️ Could not reach the webhook. Check that n8n is running and the WEBHOOK_URL is set. (' + err.message + ')';
        result.className = 'mt-3 small text-danger';
      }
    });
  </script>
</body>
</html>
